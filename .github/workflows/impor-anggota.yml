name: Impor Anggota

# Membuat akun banyak anggota sekaligus. Semuanya dari HP.
# Siapkan 2 RAHASIA di GitHub (Settings -> Secrets and variables -> Actions -> New repository secret):
#   FIREBASE_SERVICE_ACCOUNT = seluruh isi file service-account.json (sudah ada bila kamu pernah pakai Pulihkan Admin)
#   DAFTAR_ANGGOTA           = isi file daftar-anggota.csv (satu orang per baris: nama;kelas;divisi)
# Lalu Actions -> Impor Anggota -> Run workflow.
# Hasilnya (username + password) ada di bagian Artifacts pada halaman run.
# Setelah selesai: HAPUS kedua rahasia itu.

on:
  workflow_dispatch:

jobs:
  impor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buat akun anggota
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DAFTAR_ANGGOTA: ${{ secrets.DAFTAR_ANGGOTA }}
          HASIL_FILE: ${{ runner.temp }}/hasil-akun.csv
        run: node scripts/import-members.mjs
      - name: Simpan hasil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-akun
          path: ${{ runner.temp }}/hasil-akun.csv
          if-no-files-found: ignore
