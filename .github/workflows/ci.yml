name: Japanese Club CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Backend and Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless

      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run backend tests
        run: npm test

      - name: Run browser E2E tests
        env:
          SHOTS_DIR: ${{ github.workspace }}/artifacts/e2e
        run: npm run test:e2e

      - name: Upload E2E screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japanese-club-e2e-results
          path: artifacts/e2e/
          if-no-files-found: warn
          retention-days: 14
