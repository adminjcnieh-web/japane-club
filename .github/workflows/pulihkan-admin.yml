name: Pulihkan Admin

# Dipakai bila akun admin hilang / lupa password. Semuanya dari HP.
# Siapkan dulu 2 RAHASIA di GitHub (Settings -> Secrets and variables -> Actions -> New repository secret):
#   FIREBASE_SERVICE_ACCOUNT = seluruh isi file service-account.json
#   ADMIN_PASSWORD           = password baru untuk admin (min 8, huruf + angka)
# Lalu Actions -> Pulihkan Admin -> Run workflow, isi username dan nama.
# Setelah berhasil: HAPUS kedua rahasia itu dan langsung ganti password lewat Profil.

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Username admin (huruf kecil/angka, min 3)'
        required: true
      nama:
        description: 'Nama lengkap admin'
        required: true
        default: 'Admin'

jobs:
  pulihkan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pulihkan admin
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_USERNAME: ${{ inputs.username }}
          ADMIN_NAME: ${{ inputs.nama }}
        run: node scripts/recover-admin.mjs
